services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 15
  topic-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: /opt/kafka/bin/kafka-topics.sh
    command: --bootstrap-server kafka:9092 --create --if-not-exists --topic keytrace.audit --partitions 1 --replication-factor 1
  verifier:
    build: ./verifier
    environment:
      TOKEN_SECRET: ${TOKEN_SECRET:?Run python3 scripts/setup.py first}
  notes:
    image: python:3.12-slim
    command: python /app/notes.py
    volumes:
      - ./audit/notes.py:/app/notes.py:ro
      - notes-data:/notes
  proxy:
    build: ./proxy
    ports: ["127.0.0.1:8080:8080"]
    environment:
      KAFKA_BROKER: kafka:9092
      VERIFIER_URL: http://verifier:8081/verify
      UPSTREAM_URL: http://notes:8082/actions
    depends_on:
      topic-init: {condition: service_completed_successfully}
      verifier: {condition: service_started}
      notes: {condition: service_started}
  audit:
    build: ./audit
    volumes: ["audit-data:/data"]
    depends_on:
      topic-init: {condition: service_completed_successfully}
    restart: on-failure
volumes:
  kafka-data:
  notes-data:
  audit-data:
